<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <title>Member Card</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
    }

    .page {
      width: 1000mm;
      height: 297mm;
      padding: 20mm;
      background-image: url('https://iaoi.in/uploads/certificate/IAOI Certificate of Participation_page-0001.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .logo {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 100px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      background-color: rgba(255, 255, 255, 0.8);
    }

    .card h2 {
      text-align: center;
      color: royalblue;
      margin-bottom: 20px;
    }

    .card p {
      font-size: 16px;
      margin: 10px 0;
    }

    .member-data {
      font-size: 18px;
      margin: 10px 0;
    }
     .paragraph{
   font-weight: 500;
   font-size: 20px;
   font-family: sans-serif;
   color: rgb(41, 40, 40);
}
    h1 {
            font-family: 'Roboto', sans-serif;
        }

  </style>
</head>
<body>
  <div class="page">
    <br><br><br><br><br><br><br><br><br><br><br><br><br><br>
    <div style="justify-content: center;color: #34b3a8;">
        <h3><span style="font-size:30px"><span>.</span>{fullName}</span></h3>
        <div class="paragraph" style="text-align: start;">has successfully participated<br> in the webinar <span style="font-weight: 600;">"Immediate Implant Placement<br> in Posterior Extraction Sockets: A Tale of<br> Immediacy"</span> Conducted by<br> <span style="font-weight: 600;">Dr. Casian Roman</span>, DMD, MSc.<br> on <span style="color: #3AAFA9;font-weight: 600;">November 17,2024</span></div> 
    </div>
  </div>
</body>
</html>
