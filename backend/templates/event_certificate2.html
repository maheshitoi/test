<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<title>Member Certificate</title>
<style>
   body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
    }

    .page {
      width: 210mm;
      height: 297mm;
      padding: 20mm;
      background-image: url('https://iaoi.in/uploads/certificate/Background _ Participation Certificate.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      box-sizing: border-box;
      position: relative;
    }

    .logo {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 100px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      background-color: rgba(255, 255, 255, 0.8);
    }

    .card h2 {
      text-align: center;
      color: royalblue;
      margin-bottom: 20px;
    }

    .card p {
      font-size: 16px;
      margin: 10px 0;
    }

    .member-data {
      font-size: 18px;
      margin: 10px 0;
    }
    h1 {
            font-family: 'Roboto', sans-serif;
        }

  </style>
</head>
